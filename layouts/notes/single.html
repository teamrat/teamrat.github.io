{{ define "main" }}
<article class="single-post">
  <div class="date-heading">{{ .Date.Format "Monday, 2 January 2006" }}</div>

  <div class="post-body">
    {{ .Content }}
    <span class="note-timestamp"><a href="{{ .Permalink }}" class="star" title="Permalink"><i class="fa-solid fa-link"></i></a> {{ .Date.Format "3:04 PM" }}</span>
    {{ partial "tags.html" . }}
  </div>
</article>
{{ end }}
