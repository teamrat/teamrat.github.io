{{ define "main" }}
<article class="single-post">
  <div class="date-heading">{{ .Date.Format "Monday, 2 January 2006" }}</div>

  <div class="post-body">
    <p class="note-title"><strong>{{ .Title }}</strong> <a href="{{ .Permalink }}" class="star" title="Permalink"><i class="fa-solid fa-link"></i></a></p>
    {{ .Content }}
    {{ partial "tags.html" . }}
  </div>
</article>
{{ end }}
