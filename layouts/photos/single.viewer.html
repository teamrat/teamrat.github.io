<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Title }} · ተeamrat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a1e;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .viewer-container {
            max-width: 90vw;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .image-wrapper {
            border: 1px solid #333338;
            border-radius: 4px;
            padding: 8px;
            background: #222226;
            margin-bottom: 24px;
        }

        img {
            max-width: 100%;
            max-height: 70vh;
            display: block;
            border-radius: 2px;
        }

        .metadata {
            text-align: center;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: #d4cfc4;
        }

        .photo-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: #d4cfc4;
        }

        .photo-info {
            font-size: 0.9rem;
            color: #8a857a;
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .photo-info a {
            color: #7ea8be;
            text-decoration: none;
        }

        .photo-info a:hover {
            color: #a5cade;
        }
    </style>
</head>
<body>
    <div class="viewer-container">
        <div class="image-wrapper">
            {{ with .Params.image }}
                <img src="{{ . }}" alt="{{ $.Title }}" loading="eager">
            {{ end }}
        </div>

        <div class="metadata">
            <div class="photo-title">{{ .Title }}</div>
            <div class="photo-info">
                {{ with .Params.exif.date }}
                    <span>{{ . }}</span>
                {{ end }}

                {{ with .Params.exif.location }}
                    {{ if $.Params.exif.location_link }}
                        <a href="{{ $.Params.exif.location_link }}" target="_blank" rel="noopener">{{ . }}</a>
                    {{ else }}
                        <span>{{ . }}</span>
                    {{ end }}
                {{ end }}
            </div>
        </div>
    </div>
</body>
</html>
